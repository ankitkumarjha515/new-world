<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No maximum-scale / user-scalable=no: those are ignored by modern iOS
     anyway, and declaring them trips an accessibility failure for anyone who
     relies on zoom. Pinch-zoom while PLAYING is suppressed in ui/controls.js,
     which is the only place it actually causes trouble, and the menus stay
     zoomable. viewport-fit=cover is what makes env(safe-area-inset-*) real. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1620">
<meta name="description" content="A hand-painted procedural open world you can walk around in. No install, no account.">
<title>Whispering Meadow</title>

<!-- Interface styles first and blocking, deliberately: they are 20 KB of
     plain CSS and they are what paints the title card. The 3D engine below
     is loaded after, and asynchronously, so the first frame a phone shows
     does not wait on a megabyte of Three.js. -->
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/ui.css">

<!-- The engine and the first model are both needed within a second of the
     page appearing, and on a phone the round trip is most of that second. -->
<link rel="modulepreload" href="/vendor/three/build/three.module.js">
</head>
<body>

<div id="app"></div>
<div id="frame"></div>

<!-- The boot screen is STATIC MARKUP, not built by JavaScript.

     ui/ui.js adopts this element instead of creating its own, so the title
     card is on screen as soon as the CSS above has loaded - no module parse,
     no engine download, nothing to wait for. Everything else in the
     interface is built in ui/screens.js; this one card is the exception
     because it is the only thing anybody sees during boot. -->
<div class="screen opaque on" id="screen-boot">
  <div class="card">
    <div class="kicker">A place that does not exist</div>
    <h1 class="hero">Whispering <em>Meadow</em></h1>
    <div id="boot-bar"><i></i></div>
    <div id="boot-msg">Growing the world&hellip;</div>
  </div>
</div>

<!-- Settings must be live before the interface reads it. Plain script, so it
     is also reachable from net.js and voice.js, which are not modules. -->
<script src="/settings.js"></script>

<!-- The interface. Loads and runs independently of the 3D engine, which is
     why the menus, the settings panel and the touch controls all work even
     if WebGL never starts. -->
<script type="module" src="/ui/ui.js"></script>

<!-- Multiplayer, chat and proximity voice. Publishes window.MeadowNet;
     net.js loads voice.js on its own. Safe if the server is unreachable. -->
<script src="/net.js"></script>

<!-- The engine is served from this site, once.

     It used to arrive twice from a CDN: three.min.js (645 KB) as a global
     script for the game, and then three.module.js (1.2 MB) all over again
     because GLTFLoader is an ES module that imports from "three" and could
     not see the global one. Nearly two megabytes of the same library, two
     full parses, and a "Multiple instances of Three.js" warning in the
     console to prove it - all of it on the critical path before a phone
     could show a single tree.

     One local copy of the minified ES module fixes all three at once. The
     import map points "three" at it, so GLTFLoader resolves to the SAME
     instance the game is using, and the global is just a reference to it
     for the rest of the code, which was written against a global. -->
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js" } }
</script>

<script type="module">
(async function () {
  /* Every failure below has to reach the player as words on the boot card,
     not as a console entry on a phone that has no console. MeadowUI may not
     have finished evaluating if ITS module failed, so this falls back to
     writing the element directly. */
  function fail(msg) {
    if (window.MeadowUI) { window.MeadowUI.failed(msg); return; }
    var el = document.getElementById('boot-msg');
    if (el) { el.textContent = msg; el.className = 'error'; }
  }

  var mod = null;
  try {
    mod = await import('/vendor/three/build/three.module.js');
  } catch (e) {
    /* only if this site's own copy is somehow unreachable */
    try { mod = await import('https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js'); }
    catch (e2) { console.error(e, e2); }
  }
  if (!mod || !mod.WebGLRenderer) {
    fail('Could not load the 3D engine — check your connection and reload.');
    return;
  }

  /* A copy, not the namespace object itself: module namespaces are frozen,
     and models.js caches the loader class on THREE.GLTFLoader once it has
     it. Assigning to a frozen namespace throws in strict mode. */
  window.THREE = Object.assign({}, mod);

  try {
    await import('/game/main.js');
    window.__startWorld();
  } catch (err) {
    console.error(err);
    fail('The world failed to load. See the browser console for details.');
  }
})();
</script>

</body>
</html>
